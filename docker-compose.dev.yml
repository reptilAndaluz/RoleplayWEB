services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rol_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en tu .env local}
      POSTGRES_DB: ${POSTGRES_DB:-rol_db}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rol_user} -d ${POSTGRES_DB:-rol_db}']
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
