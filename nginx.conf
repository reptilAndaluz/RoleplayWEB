# =========================================================================
# CONFIGURACIÓN DE NGINX PROXY INVERSO PARA DEBIAN
# Ubicación en Debian: /etc/nginx/sites-available/gremio-heroes
# Activación: ln -s /etc/nginx/sites-available/gremio-heroes /etc/nginx/sites-enabled/
# =========================================================================

upstream fastapi_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    
    # Cambia esto por tu dominio real (ej: gremioheroes.com) o usa "_" para aceptar cualquier petición
    server_name roleplayweb.reptilandaluz.com;

    # Aumentar límite de tamaño de subida para avatares y galerías de gran peso
    client_max_body_size 30M;

    # Directorio de los archivos estáticos en tu servidor Debian
    # Reemplaza '/home/reptil/Documentos/Catalogo_D-D' por la ruta absoluta donde esté clonado el proyecto
    root /home/reptil/Documentos/Catalogo_D-D/html;
    index index.html;

    # ---------------------------------------------------------------------
    # 1. SERVIR ARCHIVOS ESTÁTICOS DIRECTAMENTE DESDE EL DISCO (RÁPIDO)
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché optimizada para assets estáticos (CSS, JS, imágenes de interfaz)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Servir las subidas físicas (Avatares y galerías) directamente por Nginx
    location /html/img/uploads/ {
        alias /home/reptil/Documentos/Catalogo_D-D/html/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------------------------------------------------------------------
    # 2. PROXY INVERSO PARA LA API DE FASTAPI
    # ---------------------------------------------------------------------
    location /api {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        
        # Cabeceras de Proxy Inverso estándar para seguridad y traza de IPs
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tiempos de espera optimizados
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Opcional: Redirigir errores de Nginx a páginas personalizadas o index
    error_page 404 /index.html;
}

