<!DOCTYPE html>
<html lang="es" data-theme="dragons_lair">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gremio de Héroes D&D - Detalle de Héroe</title>
  <!-- SEO -->
  <meta name="description" content="Consulta el registro y las hazañas individuales de este personaje de Dungeons & Dragons.">
  <link rel="stylesheet" href="/html/css/styles.css">
  <link rel="stylesheet" href="/html/css/portal.css">
  <link rel="stylesheet" href="/html/css/forms.css">
  <style>
    /* Estilos específicos para la página de detalle individual */
    .detail-card {
      margin-top: 20px;
      padding: 40px;
      border-width: 2px;
      animation: detailEntrance 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }
    
    .detail-back-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .detail-layout-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 40px;
    }

    @media (max-width: 768px) {
      .detail-layout-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }
      .detail-card {
        padding: 24px;
      }
    }

    .detail-avatar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    .detail-big-avatar {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 4px solid var(--secondary);
      object-fit: cover;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      background-color: var(--bg);
      transition: var(--transition);
    }

    [data-theme="tavern_parchment"] .detail-big-avatar {
      border-color: var(--primary);
    }

    .detail-big-avatar:hover {
      transform: scale(1.03);
      border-color: #ffffff;
      box-shadow: 0 0 20px var(--secondary-glow);
    }

    .detail-info-container h2 {
      font-size: 2.5rem;
      color: #ffffff;
      margin-bottom: 4px;
    }

    [data-theme="tavern_parchment"] .detail-info-container h2 {
      color: var(--primary);
    }

    .detail-apodo-txt {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: var(--secondary);
      margin-bottom: 25px;
      letter-spacing: 1px;
      font-style: italic;
    }

    [data-theme="tavern_parchment"] .detail-apodo-txt {
      color: var(--text-muted);
    }

    .detail-section-header {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      color: var(--secondary);
      margin-bottom: 12px;
      border-bottom: 2px solid var(--surface-border);
      padding-bottom: 6px;
      letter-spacing: 1px;
    }

    [data-theme="tavern_parchment"] .detail-section-header {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .detail-story-desc {
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.7;
      text-align: justify;
      white-space: pre-wrap;
      margin-bottom: 35px;
    }

    @keyframes detailEntrance {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <!-- Script de carga rápida del Tema -->
  <script>
    (async function() {
      try {
        const response = await fetch('/api/config');
        if (response.ok) {
          const config = await response.json();
          if (config.tema) {
            document.documentElement.setAttribute('data-theme', config.tema);
            if (config.titulo) {
              document.title = config.titulo + " - Detalle de Héroe";
            }
          }
        }
      } catch (e) {
        console.error("Error al cargar tema:", e);
      }
    })();
  </script>
</head>
<body>

  <!-- Cabecera Mística -->
  <header>
    <div class="nav-container">
      <a href="/html/portal.html" class="logo-section">
        <svg class="logo-icon" viewBox="0 0 100 100" id="header-logo">
          <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="none" stroke="var(--secondary)" stroke-width="2.5"/>
          <polygon points="50,5 50,95" fill="none" stroke="var(--secondary)" stroke-width="1.2"/>
          <polygon points="10,25 90,25" fill="none" stroke="var(--secondary)" stroke-width="1.2"/>
          <polygon points="10,75 90,75" fill="none" stroke="var(--secondary)" stroke-width="1.2"/>
          <circle cx="50" cy="50" r="14" fill="var(--bg)" stroke="var(--primary)" stroke-width="1.5"/>
          <text x="50" y="54" font-family="'Cinzel', serif" font-weight="bold" font-size="12" fill="var(--text)" text-anchor="middle">20</text>
        </svg>
        <span class="site-title" id="site-title-text">Gremio de Héroes</span>
      </a>
      
      <ul class="nav-menu">
        <li><a href="/html/portal.html" class="nav-link active">Crónicas</a></li>
        <li><a href="/html/crearEntrada.html" class="nav-link">Crear Héroe</a></li>
        <li id="admin-nav-item" style="display: none;"><a href="/html/admin.html" class="nav-link">Personalizar</a></li>
        <li><button id="logout-btn" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;">Salir</button></li>
      </ul>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="portal-container">
    
    <!-- Barra de retroceso y acciones rápidas -->
    <div class="detail-back-bar">
      <a href="/html/portal.html" class="btn btn-secondary" style="padding: 8px 16px; font-size: 0.85rem;">← Volver a las Crónicas</a>
      <div id="detail-actions-group" style="display: flex; gap: 10px;">
        <!-- Se cargan botones de editar/borrar dinámicamente si es dueño/admin -->
      </div>
    </div>

    <!-- Tarjeta de Detalle del Héroe -->
    <section class="card-glass detail-card" id="detail-card-content">
      <div style="padding: 40px; text-align: center; color: var(--text-muted);">
        🔮 Extrayendo el registro del héroe de los anales del gremio...
      </div>
    </section>

  </main>

  <div class="notification-container" id="notification-container"></div>

  <footer>
    <p>&copy; 2026 Gremio de Héroes D&D. Archivo Místico Privado.</p>
  </footer>

  <script src="/html/js/auth.js"></script>
  <script src="/html/js/theme.js"></script>
  <script src="/html/js/detalle.js"></script>
</body>
</html>
